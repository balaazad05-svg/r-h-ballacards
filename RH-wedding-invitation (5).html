<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>R &amp; H — بانگهێشتی زەماوەند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a86a;
    --gold-light:#e8dcc0;
    --ink:#2b2620;
    --paper:#f4efe3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Noto Naskh Arabic','Noto Sans Arabic',Tahoma,sans-serif;
  }
  #app{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ---------- INTRO / ENVELOPE ---------- */
  #intro{
    position:absolute; inset:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    cursor:pointer;
    transition:opacity 1s ease, visibility 1s ease;
  }
  #intro img{
    width:100%; height:100%; object-fit:cover;
    display:block;
    transform:scale(1);
    transition:transform 1.4s cubic-bezier(.7,0,.3,1), filter 1.4s ease;
  }
  #intro.opening img{
    transform:scale(1.15);
    filter:brightness(1.3) blur(2px);
  }
  #intro.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #tap-hint{
    position:absolute;
    bottom:9%;
    left:50%;
    transform:translateX(-50%);
    color:var(--gold-light);
    letter-spacing:2px;
    font-size:15px;
    text-align:center;
    padding:10px 26px;
    border:1px solid rgba(232,220,192,.55);
    border-radius:30px;
    background:rgba(20,18,14,.28);
    backdrop-filter:blur(3px);
    animation:pulse 2.2s ease-in-out infinite;
    z-index:2;
  }
  @keyframes pulse{
    0%,100%{ opacity:.65; transform:translateX(-50%) translateY(0); }
    50%{ opacity:1; transform:translateX(-50%) translateY(-6px); }
  }
  #intro.opening #tap-hint{ opacity:0; }

  /* flash of light when seal breaks */
  #flash{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 55%, rgba(255,250,235,.95), rgba(255,250,235,0) 60%);
    opacity:0;
    pointer-events:none;
    z-index:51;
  }
  #flash.go{
    animation:flashpop 1.1s ease forwards;
  }
  @keyframes flashpop{
    0%{ opacity:0; }
    35%{ opacity:1; }
    100%{ opacity:0; }
  }

  /* ---------- STORY / SCROLL SECTIONS ---------- */
  #story{
    position:absolute; inset:0;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    opacity:0;
    transition:opacity .8s ease;
  }
  #story.show{ opacity:1; }
  #story::-webkit-scrollbar{ display:none; }

  .slide{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#0c0a08;
  }
  .slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transform:scale(1.06);
    transition:opacity 1.4s cubic-bezier(.22,.8,.25,1), transform 2s cubic-bezier(.22,.8,.25,1);
  }
  .slide.in img{
    opacity:1;
    transform:scale(1);
  }
  .slide::after{
    content:'';
    position:absolute;
    inset:14px;
    border:1px solid rgba(232,220,192,.38);
    pointer-events:none;
    z-index:4;
    opacity:0;
    transition:opacity 1.4s ease .4s;
  }
  .slide.in::after{ opacity:1; }
  .slide::before{
    content:'';
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(10,8,5,.35) 100%);
  }

  /* progress dots */
  #dots{
    position:fixed;
    top:50%;
    right:14px;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:40;
    opacity:0;
    transition:opacity .6s ease;
  }
  #dots.show{ opacity:1; }
  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(244,239,227,.35);
    transition:all .35s ease;
  }
  .dot.active{
    background:var(--gold-light);
    height:20px;
    border-radius:4px;
  }

  /* end swipe hint on last slide reached first time */
  .swipe-cue{
    position:absolute;
    bottom:6%;
    left:50%;
    transform:translateX(-50%);
    color:var(--gold-light);
    font-size:12px;
    letter-spacing:2px;
    opacity:.85;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    z-index:5;
    pointer-events:none;
  }
  .swipe-cue .chev{
    width:16px; height:16px;
    border-right:2px solid var(--gold-light);
    border-bottom:2px solid var(--gold-light);
    transform:rotate(45deg);
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:rotate(45deg) translate(0,0); opacity:.5;}
    50%{ transform:rotate(45deg) translate(4px,4px); opacity:1;}
  }
  #s1 .swipe-cue{ display:none; }
  #s1.in .swipe-cue{ display:flex; }

  @media (prefers-reduced-motion: reduce){
    #intro img, .slide img, #tap-hint, .chev{ transition:none !important; animation:none !important; }
  }

  /* ---------- MUSIC TOGGLE ---------- */
  #sound-toggle{
    position:fixed;
    top:18px;
    right:18px;
    z-index:60;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(232,220,192,.55);
    background:rgba(20,18,14,.35);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:0;
    visibility:hidden;
    transition:opacity .6s ease, visibility .6s ease, transform .2s ease;
  }
  #sound-toggle.show{ opacity:1; visibility:visible; }
  #sound-toggle:active{ transform:scale(.92); }
  #sound-toggle svg{ width:18px; height:18px; }
  #sound-toggle path, #sound-toggle line{
    stroke:var(--gold-light);
    fill:none;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  #sound-toggle .fill{ fill:var(--gold-light); stroke:none; }
  #sound-toggle .muted-line{ display:none; }
  #sound-toggle.muted .muted-line{ display:block; }

  /* ---------- LOCATION BUTTON ---------- */
  .map-btn{
    position:absolute;
    bottom:9%;
    left:50%;
    transform:translateX(-50%);
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:#2b2620;
    background:var(--gold-light);
    text-decoration:none;
    font-size:14px;
    letter-spacing:1px;
    padding:12px 26px;
    border-radius:30px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    z-index:5;
    opacity:0;
    transform:translateX(-50%) translateY(10px);
    transition:opacity .8s ease .3s, transform .8s ease .3s;
  }
  #s4.in .map-btn{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- BUTTERFLIES ---------- */
  #butterflies{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:45;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  #butterflies.show{ opacity:1; }
  .bfly{
    position:absolute;
    width:30px; height:24px;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
  }
  .bfly svg{ width:100%; height:100%; display:block; overflow:visible; }
  .wing{
    transform-origin:50% 50%;
    animation:flap .42s ease-in-out infinite alternate;
  }
  .wing.right{ animation-delay:.03s; }
  .wing-outer{ fill:var(--gold-light); opacity:.92; }
  .wing-inner{ fill:#f6ead0; opacity:.85; }
  .bfly-body{ fill:#8a6d3a; }
  .bfly-antenna{ stroke:#8a6d3a; stroke-width:.8; fill:none; stroke-linecap:round; }
  @keyframes flap{
    0%{ transform:scaleX(1); }
    100%{ transform:scaleX(.32); }
  }
  .bfly.b1{ top:18%; right:-8%; left:auto; animation-name:fly1; animation-duration:14s; }
  .bfly.b2{ top:55%; right:-8%; left:auto; animation-name:fly2; animation-duration:18s; animation-delay:3s; }
  .bfly.b3{ top:75%; right:-8%; left:auto; animation-name:fly1; animation-duration:16s; animation-delay:7s; }
  .bfly.b4{ top:32%; right:-8%; left:auto; animation-name:fly2; animation-duration:20s; animation-delay:11s; }
  @keyframes fly1{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); }
    20%{ transform:translate(-28vw,-7vh) rotate(-6deg) scale(1.05); }
    40%{ transform:translate(-52vw,5vh) rotate(4deg) scale(.95); }
    60%{ transform:translate(-74vw,-9vh) rotate(-5deg) scale(1.05); }
    80%{ transform:translate(-96vw,3vh) rotate(3deg) scale(1); }
    100%{ transform:translate(-120vw,-4vh) rotate(0deg) scale(1); }
  }
  @keyframes fly2{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); }
    25%{ transform:translate(-30vw,9vh) rotate(6deg) scale(1.05); }
    50%{ transform:translate(-58vw,-7vh) rotate(-4deg) scale(.95); }
    75%{ transform:translate(-85vw,7vh) rotate(5deg) scale(1.05); }
    100%{ transform:translate(-118vw,-3vh) rotate(0deg) scale(1); }
  }

  /* ---------- SWIRLING RIBBON ACCENT (slide 1) ---------- */
  .ribbon-accent{
    position:absolute;
    top:8%;
    right:7%;
    width:70px;
    height:70px;
    z-index:6;
    opacity:0;
    transform:scale(.6) rotate(-25deg);
    transition:opacity 1s ease .5s, transform 1s ease .5s;
  }
  #s1.in .ribbon-accent{
    opacity:1;
    transform:scale(1) rotate(0deg);
  }
  .ribbon-accent svg{
    width:100%; height:100%;
    animation:ribbonSwirl 6s ease-in-out infinite;
    transform-origin:50% 40%;
  }
  @keyframes ribbonSwirl{
    0%,100%{ transform:rotate(-8deg) scale(1); }
    50%{ transform:rotate(8deg) scale(1.06); }
  }

  /* ---------- COUNTDOWN SLIDE ---------- */
  .countdown-slide{
    background:radial-gradient(ellipse at 50% 20%, #1b2440 0%, #0c1120 62%, #070a14 100%);
  }
  .countdown-slide::before{ display:none; }
  .cd-wrap{
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    padding:0 8%;
    text-align:center;
    opacity:0;
    transform:translateY(16px);
    transition:opacity 1.1s ease .2s, transform 1.1s ease .2s;
  }
  .countdown-slide.in .cd-wrap{ opacity:1; transform:translateY(0); }
  .cd-flourish{ width:120px; height:auto; opacity:.8; }
  .cd-flourish path{ stroke:var(--gold); fill:none; stroke-width:1.2; }
  .cd-eyebrow{
    font-family:'Amiri', 'Noto Naskh Arabic', serif;
    color:var(--gold-light);
    font-size:15px;
    letter-spacing:3px;
    opacity:.9;
  }
  .cd-names{
    font-family:'Cormorant Garamond', 'Amiri', serif;
    font-size:44px;
    color:var(--gold-light);
    letter-spacing:2px;
  }
  .cd-row{
    display:flex;
    align-items:center;
    gap:14px;
    direction:ltr;
  }
  .cd-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:64px;
    padding:14px 6px 12px;
    border:1px solid rgba(201,168,106,.5);
    border-radius:10px;
    background:rgba(201,168,106,.06);
  }
  .cd-num{
    font-family:'Cormorant Garamond', serif;
    font-size:38px;
    font-weight:600;
    color:#f4efe3;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .cd-label{
    margin-top:6px;
    font-family:'Amiri','Noto Naskh Arabic',serif;
    font-size:12px;
    color:var(--gold);
    letter-spacing:1px;
  }
  .cd-sep{
    color:var(--gold);
    font-size:26px;
    margin-top:-14px;
    opacity:.6;
  }
  .cd-date{
    font-family:'Amiri', serif;
    font-size:17px;
    color:var(--gold-light);
    letter-spacing:2px;
    opacity:.85;
  }
</style>
</head>

        <path class="wing left wing-inner" d="M15 12 C 8 2, 0 3, 4 10 C 6 13, 11 13.5, 15 12 Z"/>
        <path class="wing right wing-outer" d="M15 12 C 25 -3, 36 -1, 29 10 C 26 15, 20 15, 15 12 Z"/>
        <path class="wing right wing-inner" d="M15 12 C 22 2, 30 3, 26 10 C 24 13, 19 13.5, 15 12 Z"/>
        <line class="bfly-antenna" x1="15" y1="9" x2="12" y2="4"/>
        <line class="bfly-antenna" x1="15" y1="9" x2="18" y2="4"/>
        <ellipse class="bfly-body" cx="15" cy="12" rx="1.4" ry="5"/>
      </svg>
    </div>
  </div>

</div>

<script>
(function(){
  var intro = document.getElementById('intro');
  var flash = document.getElementById('flash');
  var story = document.getElementById('story');
  var dots = document.getElementById('dots');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var dotEls = Array.prototype.slice.call(document.querySelectorAll('.dot'));
  var opened = false;
  var soundBtn = document.getElementById('sound-toggle');
  var audioCtx = null;
  var masterGain = null;
  var musicMuted = false;
  var musicStarted = false;

  // ---- gentle generative "Canon in D" ambience (Web Audio, no external files) ----
  function startMusic(){
    if(musicStarted) return;
    musicStarted = true;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;

      var filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2400;

      var delay = audioCtx.createDelay();
      delay.delayTime.value = 0.42;
      var feedback = audioCtx.createGain();
      feedback.gain.value = 0.22;
      var delayFilter = audioCtx.createBiquadFilter();
      delayFilter.type = 'lowpass';
      delayFilter.frequency.value = 1800;

      delay.connect(feedback);
      feedback.connect(delayFilter);
      delayFilter.connect(delay);

      masterGain.connect(filter);
      filter.connect(audioCtx.destination);
      filter.connect(delay);
      delay.connect(audioCtx.destination);

      // fade the whole mix in
      var now = audioCtx.currentTime;
      masterGain.gain.setValueAtTime(0, now);
      masterGain.gain.linearRampToValueAtTime(0.5, now + 2.2);

      // classic Pachelbel Canon in D chord progression, realized as a soft arpeggio
      var chords = [
        [146.83,220.00,293.66,369.99],   // D  (D3 A3 D4 F#4)
        [110.00,164.81,220.00,277.18],   // A  (A2 E3 A3 C#4)
        [123.47,185.00,246.94,293.66],   // Bm (B2 D3 B3 D4)
        [92.50,138.59,185.00,220.00],    // F#m
        [98.00,146.83,196.00,246.94],    // G
        [73.42,110.00,146.83,185.00],    // D (low)
        [98.00,146.83,196.00,246.94],    // G
        [110.00,164.81,220.00,277.18]    // A
      ];

      var beat = 0.62;
      var chordIdx = 0;
      var noteIdx = 0;
      var schedAheadTime = 0.25;
      var nextNoteTime = audioCtx.currentTime + 0.1;
      var timerID = null;

      function playNote(freq, time, dur){
        var osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(0.35, time + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(time);
        osc.stop(time + dur + 0.05);
      }

      function scheduler(){
        while(nextNoteTime < audioCtx.currentTime + schedAheadTime){
          var chord = chords[chordIdx % chords.length];
          var freq = chord[noteIdx % chord.length];
          playNote(freq, nextNoteTime, beat * 0.95);
          noteIdx++;
          if(noteIdx % chord.length === 0){
            chordIdx++;
          }
          nextNoteTime += beat;
        }
        timerID = setTimeout(scheduler, 80);
      }
      scheduler();
    }catch(e){ /* Web Audio unavailable - fail silently */ }
  }

  function openEnvelope(){
    if(opened) return;
    opened = true;
    intro.classList.add('opening');
    flash.classList.add('go');

    startMusic();
    soundBtn.classList.add('show');
    document.getElementById('butterflies').classList.add('show');

    // lazy-load slide images now
    slides.forEach(function(s){
      var img = s.querySelector('img');
      if(img && img.dataset.src){
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      }
    });

    setTimeout(function(){
      intro.classList.add('hidden');
      story.classList.add('show');
      dots.classList.add('show');
      document.body.style.overflow = 'hidden';
      // reveal first slide
      requestAnimationFrame(function(){
        slides[0].classList.add('in');
      });
    }, 900);
  }

  intro.addEventListener('click', openEnvelope);
  intro.addEventListener('keyup', function(e){
    if(e.key === 'Enter' || e.key === ' ') openEnvelope();
  });

  // reveal slides as they enter viewport + update dots
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var idx = slides.indexOf(entry.target);
      if(entry.isIntersecting && entry.intersectionRatio > 0.55){
        entry.target.classList.add('in');
        dotEls.forEach(function(d,i){ d.classList.toggle('active', i===idx); });
      }
    });
  }, { root: story, threshold: [0, 0.55, 1] });

  slides.forEach(function(s){ io.observe(s); });

  // click a dot to jump
  dotEls.forEach(function(d, i){
    d.style.cursor = 'pointer';
    d.addEventListener('click', function(){
      slides[i].scrollIntoView({behavior:'smooth'});
    });
  });

  // mute / unmute background music
  soundBtn.addEventListener('click', function(){
    musicMuted = !musicMuted;
    soundBtn.classList.toggle('muted', musicMuted);
    if(masterGain && audioCtx){
      var now = audioCtx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(musicMuted ? 0 : 0.5, now + 0.4);
    }
  });

  // ---- live countdown to the wedding (2026-08-08, 18:00 Erbil time / UTC+3) ----
  var WEDDING_DATE = new Date('2026-08-08T18:00:00+03:00').getTime();
  var elDays = document.getElementById('cd-days');
  var elHours = document.getElementById('cd-hours');
  var elMins = document.getElementById('cd-mins');
  var elSecs = document.getElementById('cd-secs');
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function tickCountdown(){
    var diff = WEDDING_DATE - Date.now();
    if(diff < 0) diff = 0;
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    if(elDays){
      elDays.textContent = pad(days);
      elHours.textContent = pad(hours);
      elMins.textContent = pad(mins);
      elSecs.textContent = pad(secs);
    }
  }
  tickCountdown();
  setInterval(tickCountdown, 1000);
})();
</script>

</body>
